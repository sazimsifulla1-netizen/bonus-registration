<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonus Registration & Earning App</title>
<style>
:root{
  --bg:#030a06; --card:#091710; --line:#1b3d2b;
  --green:#1be092; --gold:#ffd34d; --text:#f7fff9; --muted:#9bb0a3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial, sans-serif; background:var(--bg); color:var(--text);
  display:flex; justify-content:center; min-height:100vh; padding-bottom:60px;
}
.app-container{width:100%; max-width:440px; padding:16px;}
.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:20px; padding:20px; margin-bottom:15px;
}
.balance-card{
  background:linear-gradient(135deg,#0e3a27,#061a11);
  text-align:center; border:1px solid var(--green);
}
.balance-card h3{color:var(--muted); font-size:13px;}
.balance-card h1{color:var(--gold); font-size:42px; margin:8px 0;}
.btn{
  width:100%; padding:14px; border:0; border-radius:12px;
  background:linear-gradient(135deg,#1be092,#0ebc75);
  color:#03140c; font-weight:bold; font-size:15px; cursor:pointer; margin-top:10px;
}
.btn-gold{background:linear-gradient(135deg,#ffd34d,#e69b00); color:#3d2800;}
input, select{
  width:100%; height:48px; padding:0 14px; border-radius:12px;
  border:1px solid var(--line); background:#040d07; color:#fff; margin-top:8px; outline:none;
}
.nav-bar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:440px; background:#06140c; border-top:1px solid var(--line);
  display:flex; justify-app:space-around; padding:10px 0;
}
.nav-item{color:var(--muted); text-decoration:none; font-size:12px; text-align:center; cursor:pointer;}
.nav-item.active{color:var(--green); font-weight:bold;}
.task-item, .plan-item{
  display:flex; justify-content:space-between; align-items:center;
  background:#040e08; padding:12px; border-radius:12px; border:1px solid #142e20; margin-top:10px;
}
.pay-logo{width:32px; vertical-align:middle; margin-right:5px;}
.hidden{display:none;}
.msg{padding:10px; border-radius:8px; font-size:12px; margin-bottom:10px;}
.msg.error{background:#3a1418; color:#ff8e99;}
.msg.success{background:#0e3824; color:#7ef5be;}
</style>
</head>
<body>

<div class="app-container">

  <!-- AUTH SECTION (Login/Register) -->
  <div id="authSection">
    <div class="card">
      <h2 id="authTitle" style="text-align:center; margin-bottom:15px;">একাউন্ট খুলুন</h2>
      <div id="authMsg" class="msg hidden"></div>
      
      <div id="nameField">
        <label>আপনার নাম</label>
        <input type="text" id="name" placeholder="নাম লিখুন">
      </div>
      
      <label style="margin-top:10px; display:block;">মোবাইল নম্বর</label>
      <input type="tel" id="phone" placeholder="01XXXXXXXXX">

      <label style="margin-top:10px; display:block;">পাসওয়ার্ড</label>
      <input type="password" id="password" placeholder="****">

      <div id="ageField">
        <label style="margin-top:10px; display:block;">বয়স</label>
        <input type="number" id="age" placeholder="18+">
      </div>

      <button class="btn" id="authBtn" onclick="handleAuth()">CREATE ACCOUNT</button>
      
      <p style="text-align:center; margin-top:15px; font-size:12px; color:var(--muted); cursor:pointer;" onclick="toggleAuthMode()">
        <span id="toggleText">ইতিমধ্যে একাউন্ট আছে? লগইন করুন</span>
      </p>
    </div>
  </div>

  <!-- MAIN APP DASHBOARD -->
  <div id="appSection" class="hidden">
    
    <!-- Balance Card -->
    <div class="card balance-card">
      <h3>আপনার মোট ব্যালেন্স</h3>
      <h1 id="userBalance">৳0</h1>
      <p style="font-size:12px; color:#85d6b0;" id="userName">User Name</p>
    </div>

    <!-- Navigation Tabs -->
    <div style="display:flex; gap:8px; margin-bottom:15px;">
      <button class="btn" style="flex:1; margin:0;" onclick="showTab('tasks')">Tasks</button>
      <button class="btn btn-gold" style="flex:1; margin:0;" onclick="showTab('invest')">Invest</button>
      <button class="btn" style="flex:1; margin:0; background:#214d38; color:#fff;" onclick="showTab('withdraw')">Withdraw</button>
    </div>

    <!-- TASKS TAB -->
    <div id="tabTasks" class="card">
      <h3>দৈনিক টাস্ক</h3>
      <div id="taskMsg" class="msg hidden"></div>
      <div id="tasksContainer"></div>
    </div>

    <!-- INVEST TAB -->
    <div id="tabInvest" class="card hidden">
      <h3>ইনভেস্টমেন্ট প্ল্যান</h3>
      <p style="font-size:12px; color:var(--muted);">মেয়াদ শেষে বড় লভ্যাংশ পান</p>
      
      <div class="plan-item">
        <div><b>৩ দিন মেয়াদী</b><br><small style="color:var(--green)">+৩৫% রিটার্ন</small></div>
        <button class="btn btn-gold" style="width:auto; padding:8px 15px;" onclick="invest(3, 35)">ইনভেস্ট ৳৫০০</button>
      </div>

      <div class="plan-item">
        <div><b>৭ দিন (১ সপ্তাহ)</b><br><small style="color:var(--green)">+৫০% রিটার্ন</small></div>
        <button class="btn btn-gold" style="width:auto; padding:8px 15px;" onclick="invest(7, 50)">ইনভেস্ট ৳১০০০</button>
      </div>

      <div class="plan-item">
        <div><b>১৫ দিন মেয়াদী</b><br><small style="color:var(--green)">+৬৫% রিটার্ন</small></div>
        <button class="btn btn-gold" style="width:auto; padding:8px 15px;" onclick="invest(15, 65)">ইনভেস্ট ৳২০০০</button>
      </div>

      <div class="plan-item">
        <div><b>৩০ দিন মেয়াদী</b><br><small style="color:var(--green)">+৮০% রিটার্ন</small></div>
        <button class="btn btn-gold" style="width:auto; padding:8px 15px;" onclick="invest(30, 80)">ইনভেস্ট ৳৫০০০</button>
      </div>
    </div>

    <!-- WITHDRAW TAB -->
    <div id="tabWithdraw" class="card hidden">
      <h3>টাকা তুলুন (Withdraw)</h3>
      <div id="withdrawMsg" class="msg hidden"></div>
      
      <label>মেথড সিলেক্ট করুন</label>
      <select id="withdrawMethod">
        <option value="bKash">📱 bKash (বিকাশ)</option>
        <option value="Nagad">💳 Nagad (নগদ)</option>
      </select>

      <label style="margin-top:10px; display:block;">bKash / Nagad নম্বর</label>
      <input type="tel" id="withdrawNum" placeholder="01XXXXXXXXX">

      <label style="margin-top:10px; display:block;">টাকার পরিমাণ (সর্বনিম্ন ৳৫০০)</label>
      <input type="number" id="withdrawAmount" placeholder="500">

      <button class="btn" onclick="submitWithdraw()">WITHDRAW NOW</button>
    </div>

    <button class="btn" style="background:#3a1418; color:#ff8e99; margin-top:20px;" onclick="logout()">Logout</button>
  </div>

</div>

<script>
let currentUser = null;
let isLoginMode = false;

document.addEventListener("DOMContentLoaded", () => {
  const savedUser = localStorage.getItem("app_user");
  if (savedUser) {
    currentUser = JSON.parse(savedUser);
    fetchUserData();
  }
});

function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  document.getElementById("authTitle").innerText = isLoginMode ? "লগইন করুন" : "একাউন্ট খুলুন";
  document.getElementById("authBtn").innerText = isLoginMode ? "LOGIN" : "CREATE ACCOUNT";
  document.getElementById("nameField").style.display = isLoginMode ? "none" : "block";
  document.getElementById("ageField").style.display = isLoginMode ? "none" : "block";
  document.getElementById("toggleText").innerText = isLoginMode ? "একাউন্ট নেই? রেজিস্ট্রেশন করুন" : "ইতিমধ্যে একাউন্ট আছে? লগইন করুন";
}

async function handleAuth() {
  const phone = document.getElementById("phone").value;
  const password = document.getElementById("password").value;
  const authMsg = document.getElementById("authMsg");

  if (isLoginMode) {
    const res = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, password })
    });
    const data = await res.json();
    if (!res.ok) return showMsg("authMsg", data.error, "error");
    currentUser = data.user;
  } else {
    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;

    // Get position on register
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const res = await fetch("/api/register/start", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name, phone, password, age,
          location: { latitude: pos.coords.latitude, longitude: pos.coords.longitude }
        })
      });
      const data = await res.json();
      if (!res.ok) return showMsg("authMsg", data.error, "error");
      currentUser = data.user;
      initApp();
    }, () => alert("দয়া করে লোকেশন পারমিশন দিন!"));
    return;
  }
  initApp();
}

function initApp() {
  localStorage.setItem("app_user", JSON.stringify(currentUser));
  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("appSection").classList.remove("hidden");
  updateUI();
  startLiveLocation();
  loadTasks();
}

async function fetchUserData() {
  const res = await fetch(`/api/user/${currentUser.id}`);
  const data = await res.json();
  if (data.ok) {
    currentUser = data.user;
    initApp();
  } else {
    logout();
  }
}

function updateUI() {
  document.getElementById("userBalance").innerText = `৳${currentUser.balance || 0}`;
  document.getElementById("userName").innerText = `Welcome, ${currentUser.name}`;
}

function startLiveLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
      fetch(`/api/user/${currentUser.id}/location`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ latitude: pos.coords.latitude, longitude: pos.coords.longitude })
      });
    });
  }
}

function showTab(tab) {
  document.getElementById("tabTasks").classList.add("hidden");
  document.getElementById("tabInvest").classList.add("hidden");
  document.getElementById("tabWithdraw").classList.add("hidden");

  if (tab === 'tasks') document.getElementById("tabTasks").classList.remove("hidden");
  if (tab === 'invest') document.getElementById("tabInvest").classList.remove("hidden");
  if (tab === 'withdraw') document.getElementById("tabWithdraw").classList.remove("hidden");
}

async function loadTasks() {
  const res = await fetch("/api/tasks");
  const data = await res.json();
  const container = document.getElementById("tasksContainer");
  container.innerHTML = data.tasks.map(t => `
    <div class="task-item">
      <div><b>${t.title}</b><br><small style="color:var(--gold)">Reward: ৳${t.reward}</small></div>
      <button class="btn" style="width:auto; padding:6px 15px;" onclick="claimTask('${t.id}')">Claim</button>
    </div>
  `).join("");
}

async function claimTask(taskId) {
  const res = await fetch("/api/tasks/claim", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: currentUser.id, taskId })
  });
  const data = await res.json();
  if (!res.ok) return showMsg("taskMsg", data.error, "error");
  currentUser.balance = data.balance;
  updateUI();
  showMsg("taskMsg", `৳${data.reward} সফলভাবে ব্যালেন্সে যোগ হয়েছে!`, "success");
}

async function submitWithdraw() {
  const method = document.getElementById("withdrawMethod").value;
  const number = document.getElementById("withdrawNum").value;
  const amount = document.getElementById("withdrawAmount").value;

  const res = await fetch("/api/withdraw", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: currentUser.id, method, number, amount })
  });
  const data = await res.json();
  if (!res.ok) return showMsg("withdrawMsg", data.error, "error");
  currentUser.balance = data.balance;
  updateUI();
  showMsg("withdrawMsg", "উইথড্র রিকোয়েস্ট জমা হয়েছে!", "success");
}

async function invest(planDays, profitPercent) {
  const amount = prompt(`আপনি কত টাকা ইনভেস্ট করতে চান? (${planDays} দিনে +${profitPercent}% রিটার্ন)`);
  if (!amount) return;

  const res = await fetch("/api/invest", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: currentUser.id, planDays, profitPercent, amount })
  });
  const data = await res.json();
  if (!res.ok) return alert(data.error);
  currentUser.balance = data.balance;
  updateUI();
  alert("ইনভেস্টমেন্ট সফল হয়েছে!");
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.className = `msg ${type}`; el.innerText = text; el.classList.remove("hidden");
}

function logout() {
  localStorage.removeItem("app_user");
  location.reload();
}
</script>
</body>
</html>
